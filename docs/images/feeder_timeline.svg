<text x='72.0' y='44.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>East Bay within 20 km: 241 to 280 vehicles today; curves start from the lower. A scenario from public filings, not a forecast. E21.</text>
