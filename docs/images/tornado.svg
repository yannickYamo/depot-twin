<text x='702.4' y='148.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>$59,082</text>
<text x='290.0' y='182.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>A person on site, $ an hour</text>
<rect x='580.6' y='166' width='29.8' height='22' rx='3' fill='#006fee' fill-opacity='0.8'/>
<text x='616.4' y='182.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>$9,000</text>
<text x='290.0' y='216.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>Land, $ a month</text>
<rect x='589.5' y='200' width='16.4' height='22' rx='3' fill='#006fee' fill-opacity='0.8'/>
<text x='611.8' y='216.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>$4,932</text>
<text x='290.0' y='250.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>Energy price, against the tariff</text>
