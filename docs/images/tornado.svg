<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 392' role='img' aria-label='Which input moves the money'>
<rect width='880' height='392' fill='#ffffff'/>
<text x='72.0' y='26.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='17' font-weight='600' fill='#050f1e' text-anchor='start'>Which input moves the money</text>
<text x='72.0' y='44.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>600 vehicles on one feeder. Each input moved alone over its range (docs/METHOD.md); the figure is the swing in contribution a day.</text>
<line x1='598.5' x2='598.5' y1='56' y2='334' stroke='#050f1e'/>
<text x='598.5' y='350.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='middle'>as recorded: $102,326 a day</text>
<text x='290.0' y='80.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>Running a vehicle, $ a day</text>
<rect x='300.0' y='64' width='397.9' height='22' rx='3' fill='#006fee' fill-opacity='0.8'/>
<text x='703.9' y='80.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>$120,000</text>
<text x='290.0' y='114.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>A vehicle, $ a year</text>
<rect x='380.4' y='98' width='381.6' height='22' rx='3' fill='#006fee' fill-opacity='0.8'/>
