<text x='290.0' y='284.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>A lost ride beyond its fare, $</text>
<rect x='597.9' y='268' width='1.0' height='22' rx='3' fill='#006fee' fill-opacity='0.8'/>
<text x='604.7' y='284.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#5d6e83' text-anchor='start'>$230</text>
<text x='290.0' y='318.0' font-family='Outfit, Inter, system-ui, sans-serif' font-size='12' font-weight='400' fill='#050f1e' text-anchor='end'>Grid connection, $ a kW</text>
