[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depot-twin"
version = "1.0.0"
description = "A digital twin of a robotaxi depot: charging, cleaning and queueing for a fleet that grows from 200 to 2,000 vehicles."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yannick Maurice" }]
dependencies = ["simpy>=4.1", "numpy>=1.26"]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=16", "huggingface_hub>=0.25"]
ml = ["scikit-learn>=1.5", "xgboost>=2.1"]
opt = ["ortools>=9.10"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.4"]
# A pretrained time-series model, used as one arm of E18. Pulls in PyTorch; install the CPU build first.
pretrained = ["chronos-forecasting>=2.3", "torch>=2.4"]
# The local operator's tool: the full model behind a few widgets.
app = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.400"]

[project.scripts]
depot-twin = "depot_twin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PLR0915", "D1"]
ignore = ["D105", "D107", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "E501"]
