# A hypothetical depot at 7825 San Leandro Street, Oakland, a quarter-scale copy of the 1,000-vehicle scenario, used only to train the recall policy.
# Sources and assumptions for every figure are in docs/SITE.md.

[depot]
name = "East Oakland, quarter scale"
site_limit_kw = 687.5       # a quarter of the 2.75 MW service
staff = 6
plug_minutes = 2
cleaning_bays = 6
clean_minutes = 8
inspect_minutes = 20
inspect_every = 10
charger_efficiency = 0.93

[[depot.chargers]]
kind = "dc"
count = 33
kw = 60

[models.ipace]
capacity_kwh = 90
max_dc_kw = 104
max_ac_kw = 11
dc_curve = [[0.0, 100], [0.4, 100], [0.6, 70], [0.8, 50], [0.9, 35], [1.0, 10]]

[models.ojai]
capacity_kwh = 93
max_dc_kw = 150
max_ac_kw = 11

[fleet]
size = 250
mix = { ipace = 0.6, ojai = 0.4 }
rides_per_vehicle_day = 25
